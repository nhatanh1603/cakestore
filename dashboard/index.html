<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poeme Live Security & Ops Radar | poemefake.id.vn</title>
    <link rel="icon" type="image/png" href="/public/Poeme Dessert Logo Icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-base: #0b1120;
            --bg-surface: rgba(22, 33, 56, 0.72);
            --bg-surface-elevated: rgba(30, 45, 74, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-light: rgba(255, 255, 255, 0.15);
            --border-glow: rgba(56, 189, 248, 0.45);
            
            --accent-green: #10b981;
            --accent-mint: #34d399;
            --accent-cyan: #38bdf8;
            --accent-blue: #3b82f6;
            --accent-gold: #fbbf24;
            --accent-amber: #f59e0b;
            --accent-red: #f43f5e;
            --accent-purple: #a855f7;

            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --font-mono: 'JetBrains Mono', monospace;
            --font-main: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }
        body {
            background: radial-gradient(120% 85% at 50% -10%, #1e293b 0%, #0f172a 45%, #080d1a 100%);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .main-container {
            height: 100vh;
            max-height: 100vh;
            padding: 12px 14px 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .content-grid-3col {
            display: grid;
            grid-template-columns: 360px 1fr 340px;
            gap: 12px;
            flex: 1;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            padding-bottom: 50px;
        }

        .col-left, .col-center, .col-right {
            background: var(--bg-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
            height: 100%;
            min-height: 0;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .col-center {
            position: relative;
        }

        .col-center #radarMap {
            flex: 1;
            min-height: 0;
            height: 100%;
            width: 100%;
            background: #090e17;
        }

        .panel-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-subtle);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            height: 44px;
        }
        .panel-header .title-group {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .icon-badge {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .icon-badge.green {
            background: rgba(16, 185, 129, 0.18);
            color: #34d399;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.25);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .icon-badge.gold {
            background: rgba(245, 158, 11, 0.18);
            color: #fbbf24;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .panel-header h2 {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: #ffffff;
            margin: 0;
        }
        .panel-header .badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 3px 9px;
            border-radius: 9999px;
            font-size: 11px;
            font-family: var(--font-mono);
            font-weight: 700;
            color: #e2e8f0;
        }

        /* Floating HUD Toolbar on top of map */
        .map-hud-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            pointer-events: none;
        }
        .hud-group {
            display: flex;
            align-items: center;
            gap: 4px;
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 4px 6px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        .hud-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #cbd5e1;
            font-size: 11.5px;
            font-family: var(--font-main);
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        .hud-btn.active {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.5);
            color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }
        .hud-btn.hud-btn-gps {
            color: #f43f5e;
        }
        .hud-btn.hud-btn-gps:hover {
            background: rgba(244, 63, 94, 0.2);
            color: #fff;
        }
        .hud-search-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 3px 9px;
            gap: 6px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .hud-search-box:focus-within {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .hud-search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 11.5px;
            width: 175px;
            padding: 3px 0;
            font-family: var(--font-main);
        }
        .hud-search-box input::placeholder {
            color: #64748b;
        }
        .hud-search-box button {
            background: transparent;
            border: none;
            color: #38bdf8;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            transition: transform 0.15s;
        }
        .hud-search-box button:hover {
            transform: translateX(2px);
            color: #fff;
        }

        /* Floating Pill Dock at bottom center */
        .floating-dock {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            padding: 7px 20px;
        }
        .dock-metric {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dock-pulse-dot {
            width: 9px;
            height: 9px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
            animation: pulse 1.6s infinite;
        }
        .dock-label {
            font-size: 10px;
            letter-spacing: 0.8px;
            color: #94a3b8;
            font-family: var(--font-mono);
            font-weight: 700;
        }
        .dock-val {
            font-family: var(--font-mono);
            font-size: 14.5px;
            font-weight: 800;
        }
        .text-green { color: #34d399; text-shadow: 0 0 10px rgba(52, 211, 153, 0.4); }
        .text-cyan { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .dock-sep {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.16);
        }
        .dock-btn-clear {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 11px;
            font-family: var(--font-main);
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            transition: all 0.2s ease;
        }
        .dock-btn-clear:hover {
            color: #fff;
            background: rgba(244, 63, 94, 0.25);
            border-color: rgba(244, 63, 94, 0.5);
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.3);
        }



        .dark-radar-popup .leaflet-popup-content-wrapper {
            background: #111827 !important;
            color: #f3f4f6 !important;
            border: 1px solid #374151 !important;
            border-radius: 8px !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7) !important;
            padding: 4px !important;
        }
        .dark-radar-popup .leaflet-popup-tip {
            background: #111827 !important;
            border: 1px solid #374151 !important;
        }
        .dark-radar-popup .leaflet-popup-content {
            margin: 8px 12px !important;
            line-height: 1.5 !important;
            font-size: 12px !important;
        }
        .radar-popup-card {
            font-family: var(--font-sans);
        }
        .radar-popup-card .popup-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #374151;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .radar-popup-card .popup-tag {
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: var(--font-mono);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .popup-tag.tag-visitor {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .popup-tag.tag-order {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .radar-popup-card .popup-time {
            font-size: 10.5px;
            color: #9ca3af;
            font-family: var(--font-mono);
        }
        .radar-popup-card .popup-location {
            margin-bottom: 6px;
            font-size: 12.5px;
            color: #fff;
        }
        .radar-popup-card .popup-ip {
            font-family: var(--font-mono);
            font-size: 11.5px;
            color: #38bdf8;
            background: #0f172a;
            padding: 3px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            word-break: break-all;
        }
        .radar-popup-card .popup-meta {
            font-size: 11.5px;
            color: #9ca3af;
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 8px;
        }
        .radar-popup-card .popup-meta strong {
            color: #e5e7eb;
        }
        .radar-popup-card .popup-meta .path-code {
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
            padding: 1px 4px;
            border-radius: 2px;
            font-family: var(--font-mono);
        }
        .radar-popup-card .popup-actions {
            margin-top: 8px;
            display: flex;
            gap: 6px;
        }
        .btn-popup-gmaps {
            flex: 1;
            text-align: center;
            background: #2563eb;
            color: #fff !important;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background 0.15s;
        }
        .btn-popup-gmaps:hover {
            background: #1d4ed8;
        }

        .custom-radar-pin-wrap {
            background: none !important;
            border: none !important;
        }
        .radar-pin-visitor {
            position: relative;
            width: 24px;
            height: 24px;
            background: #10b981;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.8);
            cursor: pointer;
        }
        .radar-pin-visitor::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid #10b981;
            border-radius: 50%;
            animation: radar-ripple 1.8s infinite ease-out;
            pointer-events: none;
        }
        .radar-pin-order {
            position: relative;
            width: 28px;
            height: 28px;
            background: #f59e0b;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 11px;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.9);
            cursor: pointer;
        }
        .radar-pin-order::after {
            content: '';
            position: absolute;
            width: 46px;
            height: 46px;
            border: 2px solid #f59e0b;
            border-radius: 50%;
            animation: radar-ripple 1.5s infinite ease-out;
            pointer-events: none;
        }
        .radar-pin-gps {
            position: relative;
            width: 28px;
            height: 28px;
            background: #ef4444;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.9);
            cursor: pointer;
        }
        .radar-pin-gps::after {
            content: '';
            position: absolute;
            width: 48px;
            height: 48px;
            border: 2px solid #ef4444;
            border-radius: 50%;
            animation: radar-ripple 1.2s infinite ease-out;
            pointer-events: none;
        }
        @keyframes radar-ripple {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* Left Column: Visitor Stream Feed */
        .visitor-stream-feed {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .visitor-card {
            background: rgba(30, 41, 59, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 7px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
        }
        .visitor-card:hover {
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(52, 211, 153, 0.55);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -3px rgba(0, 0, 0, 0.4), 0 0 14px rgba(16, 185, 129, 0.22);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .vcard-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .vcard-ip-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .vcard-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }
        .vcard-ip {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
        }
        .vcard-time {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-muted);
        }
        .vcard-loc {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: #e2e8f0;
        }
        .vcard-flag {
            font-size: 14px;
        }
        .vcard-place {
            color: #ffffff;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vcard-isp {
            margin-left: auto;
            font-size: 10px;
            color: #cbd5e1;
            font-family: var(--font-mono);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 1px 6px;
            border-radius: 4px;
            max-width: 95px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vcard-bottom {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .vcard-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 10.5px;
            color: #cbd5e1;
            font-weight: 500;
        }
        .vcard-pill.path {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.35);
            font-family: var(--font-mono);
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vcard-gmaps-link {
            margin-left: auto;
            color: #94a3b8;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            transition: all 0.15s;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .vcard-gmaps-link:hover {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.18);
            border-color: rgba(56, 189, 248, 0.4);
        }

        /* Right Column: Orders Feed */
        .orders-feed {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .order-card-live {
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.09) 0%, rgba(22, 33, 56, 0.65) 100%);
            border: 1px solid rgba(245, 158, 11, 0.38);
            border-left: 4px solid #fbbf24;
            border-radius: 9px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
        }
        .order-card-live:hover {
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.15) 0%, rgba(30, 45, 74, 0.85) 100%);
            border-color: rgba(251, 191, 36, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.4), 0 0 16px rgba(245, 158, 11, 0.25);
        }
        .order-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .order-card-id {
            font-family: var(--font-mono);
            font-weight: 700;
            color: #fbbf24;
            font-size: 12.5px;
            letter-spacing: 0.5px;
        }
        .order-card-time {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-muted);
        }
        .order-card-cust {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cust-phone {
            font-family: var(--font-mono);
            font-size: 11px;
            color: #e2e8f0;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1px 7px;
            border-radius: 4px;
        }
        .order-card-addr {
            font-size: 11.5px;
            color: #cbd5e1;
            line-height: 1.45;
        }
        .order-items-mini {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 7px 9px;
            font-size: 11px;
            color: #e2e8f0;
            line-height: 1.5;
        }
        .ord-item-line {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ord-qty {
            color: #fbbf24;
            font-weight: 700;
        }
        .ord-inscr {
            color: #94a3b8;
            font-size: 10.5px;
        }
        .order-note {
            font-size: 11px;
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .order-card-total {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
            padding-top: 6px;
            margin-top: 2px;
        }
        .total-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .total-val {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 800;
            color: #fbbf24;
        }

        .empty-placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 14px;
            font-size: 12px;
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
        }

        @media (max-width: 1024px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <main class="main-container">

        <div class="content-grid-3col">
            <!-- CỘT TRÁI: Luồng truy cập thời gian thực -->
            <div class="col-left">
                <div class="panel-header">
                    <div class="title-group">
                        <span class="icon-badge green"><i class="fa-solid fa-satellite-dish"></i></span>
                        <h2>Luồng Truy Cập</h2>
                    </div>
                    <span class="badge" id="visitorStreamCount">0 Khách</span>
                </div>
                <div class="visitor-stream-feed" id="visitorStreamFeed">
                    <div class="empty-placeholder" id="emptyVisitorsNotice">
                        <i class="fa-solid fa-satellite-dish" style="font-size: 26px; margin-bottom: 8px; color: var(--accent-mint); opacity: 0.7;"></i>
                        Đang lắng nghe tín hiệu từ poemefake.id.vn...
                    </div>
                </div>
            </div>

            <!-- CỘT GIỮA: Bản đồ tương tác trung tâm với HUD nổi -->
            <div class="col-center">
                <div class="map-hud-overlay">
                    <div class="hud-group hud-layers">
                        <button type="button" class="hud-btn active" id="btnLayerStreet" title="Bản đồ đường phố">
                            <i class="fa-solid fa-road"></i> <span>Phố</span>
                        </button>
                        <button type="button" class="hud-btn" id="btnLayerSatellite" title="Ảnh vệ tinh độ nét cao">
                            <i class="fa-solid fa-satellite"></i> <span>Vệ Tinh</span>
                        </button>
                        <button type="button" class="hud-btn" id="btnLayerDark" title="Bản đồ radar đêm">
                            <i class="fa-solid fa-moon"></i> <span>Đêm</span>
                        </button>
                    </div>
                    <div class="hud-group hud-actions">
                        <div class="hud-search-box">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="mapSearchInput" placeholder="Tìm địa chỉ (VD: Đình Thôn)..." maxlength="80">
                            <button type="button" id="btnMapSearch" title="Tìm địa chỉ"><i class="fa-solid fa-arrow-right"></i></button>
                        </div>
                        <button type="button" class="hud-btn hud-btn-gps" id="btnMyGps" title="Vị trí của tôi (GPS)">
                            <i class="fa-solid fa-crosshairs"></i> <span>GPS</span>
                        </button>
                        <button type="button" class="hud-btn" id="btnResetHanoi" title="Đưa tâm bản đồ về Hà Nội">
                            <i class="fa-solid fa-location-dot"></i> <span>Hà Nội</span>
                        </button>
                        <button type="button" class="hud-btn" id="btnFitBounds" title="Xem tất cả vị trí khách">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                        <span id="mapPinCount" style="display: none;">0 Pinned Locations</span>
                    </div>
                </div>
                <div id="radarMap"></div>
            </div>

            <!-- CỘT PHẢI: Đơn đặt hàng vừa đặt -->
            <div class="col-right">
                <div class="panel-header">
                    <div class="title-group">
                        <span class="icon-badge gold"><i class="fa-solid fa-bell"></i></span>
                        <h2>Đơn Đặt Hàng</h2>
                    </div>
                    <span class="badge" id="liveOrdersBadge" style="background: rgba(245, 158, 11, 0.2); color: var(--accent-gold);">0 Đơn</span>
                </div>
                <div class="orders-feed" id="ordersFeedContainer">
                    <div class="empty-placeholder" id="emptyOrdersNotice">
                        <i class="fa-solid fa-box-open" style="font-size: 26px; margin-bottom: 8px; color: var(--accent-gold); opacity: 0.6;"></i>
                        Chưa có đơn hàng mới nào được đặt.<br>
                        Khi khách bấm "Đặt hàng ngay" trên web online, đơn sẽ xuất hiện tại đây ngay lập tức!
                    </div>
                </div>
            </div>
        </div>

        <!-- DƯỚI CÙNG: Floating Pill Dock ở giữa màn hình -->
        <div class="floating-dock">
            <div class="dock-metric">
                <span class="dock-pulse-dot"></span>
                <span class="dock-label">ONLINE:</span>
                <strong class="dock-val text-green" id="kpiActiveVisitors">0</strong>
            </div>
            <div class="dock-sep"></div>
            <div class="dock-metric">
                <i class="fa-solid fa-eye text-cyan"></i>
                <span class="dock-label">TỔNG XEM:</span>
                <strong class="dock-val text-cyan" id="kpiTotalViews">0</strong>
            </div>
            <div class="dock-sep"></div>
            <button id="btnClearData" class="dock-btn-clear" title="Xóa toàn bộ lịch sử">
                <i class="fa-solid fa-trash-can"></i> <span>Xóa Lịch Sử</span>
            </button>
        </div>
    </main>

    <script>
        let map = null;
        let streetLayer = null;
        let satelliteLayer = null;
        let darkLayer = null;
        let currentLayer = null;
        const markers = [];
        const markerMap = new Map();
        const visitorsList = [];
        const ordersList = [];

        function initMap() {
            map = L.map('radarMap', { zoomControl: false }).setView([21.0285, 105.8542], 12);
            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            streetLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: '&copy; Esri & OpenStreetMap contributors',
                maxZoom: 19
            });

            satelliteLayer = L.layerGroup([
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '&copy; Esri & contributors',
                    maxZoom: 19
                }),
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19
                })
            ]);

            darkLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: '&copy; Esri & contributors',
                maxZoom: 16
            });

            streetLayer.addTo(map);
            currentLayer = streetLayer;

            const setupLayerBtn = (btnId, layer) => {
                const btn = document.getElementById(btnId);
                if (!btn) return;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.hud-layers .hud-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    if (currentLayer) map.removeLayer(currentLayer);
                    layer.addTo(map);
                    currentLayer = layer;
                });
            };

            setupLayerBtn('btnLayerStreet', streetLayer);
            setupLayerBtn('btnLayerSatellite', satelliteLayer);
            setupLayerBtn('btnLayerDark', darkLayer);

            document.getElementById('btnResetHanoi')?.addEventListener('click', () => {
                map.flyTo([21.0285, 105.8542], 12, { duration: 1.2 });
            });

            document.getElementById('btnFitBounds')?.addEventListener('click', () => {
                if (markers.length > 0) {
                    const group = L.featureGroup(markers);
                    map.fitBounds(group.getBounds(), { padding: [40, 40], maxZoom: 15 });
                } else {
                    map.flyTo([21.0285, 105.8542], 12);
                }
            });

            document.getElementById('btnMyGps')?.addEventListener('click', () => {
                if (!('geolocation' in navigator)) {
                    alert('Trình duyệt của bạn không hỗ trợ Geolocation API.');
                    return;
                }
                const btn = document.getElementById('btnMyGps');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lấy GPS...';

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        btn.innerHTML = '<i class="fa-solid fa-crosshairs"></i> Vị Trí Của Tôi (GPS)';
                        const { latitude, longitude, accuracy } = pos.coords;

                        map.flyTo([latitude, longitude], 17, { duration: 1.5 });

                        const gpsIcon = L.divIcon({
                            className: 'custom-radar-pin-wrap',
                            html: `<div class="radar-pin-gps"><i class="fa-solid fa-crosshairs"></i></div>`,
                            iconSize: [28, 28],
                            iconAnchor: [14, 14]
                        });

                        L.circle([latitude, longitude], {
                            radius: Math.max(accuracy, 25),
                            color: '#ef4444',
                            fillColor: '#ef4444',
                            fillOpacity: 0.15,
                            weight: 1.5
                        }).addTo(map);

                        const gpsMarker = L.marker([latitude, longitude], { icon: gpsIcon }).addTo(map);

                        const popupHtml = `
                            <div class="radar-popup-card">
                                <div class="popup-top">
                                    <span class="popup-tag" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444;">
                                        <i class="fa-solid fa-crosshairs"></i> VỊ TRÍ GPS CHÍNH XÁC
                                    </span>
                                    <span class="popup-time">${new Date().toLocaleTimeString('vi-VN')}</span>
                                </div>
                                <div class="popup-location">
                                    <strong>🎯 Vị trí thực tế của thiết bị bạn</strong>
                                </div>
                                <div class="popup-ip">
                                    <code>Tọa độ: ${latitude.toFixed(6)}, ${longitude.toFixed(6)}</code>
                                </div>
                                <div class="popup-meta">
                                    <div><i class="fa-solid fa-satellite"></i> Bán kính sai số: <strong>~${Math.round(accuracy)} mét</strong></div>
                                    <div style="color: #10b981; font-weight: 600;"><i class="fa-solid fa-check"></i> Đã định vị chính xác vị trí máy bạn!</div>
                                </div>
                                <div class="popup-actions">
                                    <a href="https://www.google.com/maps?q=${latitude},${longitude}" target="_blank" rel="noopener noreferrer" class="btn-popup-gmaps">
                                        <i class="fa-solid fa-map-location-dot"></i> Mở trên Google Maps
                                    </a>
                                </div>
                            </div>
                        `;
                        gpsMarker.bindPopup(popupHtml, { maxWidth: 280, className: 'dark-radar-popup' }).openPopup();
                    },
                    (err) => {
                        btn.innerHTML = '<i class="fa-solid fa-crosshairs"></i> Vị Trí Của Tôi (GPS)';
                        alert('Không thể lấy vị trí GPS: ' + (err.message || 'Quyền vị trí bị từ chối. Vui lòng bật quyền vị trí trên trình duyệt.'));
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });

            const searchAddress = async () => {
                const query = document.getElementById('mapSearchInput')?.value?.trim();
                if (!query) return;
                const btn = document.getElementById('btnMapSearch');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                try {
                    const fullQuery = query.toLowerCase().includes('hà nội') ? query : `${query}, Hà Nội, Việt Nam`;
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullQuery)}&limit=1`, {
                        headers: { 'Accept-Language': 'vi,en' }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.length > 0) {
                            const item = data[0];
                            const lat = parseFloat(item.lat);
                            const lon = parseFloat(item.lon);
                            map.flyTo([lat, lon], 17, { duration: 1.5 });

                            const searchIcon = L.divIcon({
                                className: 'custom-radar-pin-wrap',
                                html: `<div class="radar-pin-gps" style="background: #3b82f6; box-shadow: 0 0 16px rgba(59, 130, 246, 0.9);"><i class="fa-solid fa-magnifying-glass"></i></div>`,
                                iconSize: [28, 28],
                                iconAnchor: [14, 14]
                            });

                            const searchMarker = L.marker([lat, lon], { icon: searchIcon }).addTo(map);
                            searchMarker.bindPopup(`
                                <div class="radar-popup-card">
                                    <div class="popup-top">
                                        <span class="popup-tag" style="background: rgba(59, 130, 246, 0.2); color: #38bdf8; border: 1px solid #38bdf8;">
                                            <i class="fa-solid fa-search-location"></i> KẾT QUẢ TÌM KIẾM
                                        </span>
                                    </div>
                                    <div class="popup-location">
                                        <strong>${item.name || query}</strong>
                                    </div>
                                    <div style="font-size: 11px; color: #9ca3af; margin: 6px 0;">${item.display_name}</div>
                                    <div class="popup-actions">
                                        <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" rel="noopener noreferrer" class="btn-popup-gmaps">
                                            <i class="fa-solid fa-map-location-dot"></i> Mở trên Google Maps
                                        </a>
                                    </div>
                                </div>
                            `, { maxWidth: 300, className: 'dark-radar-popup' }).openPopup();
                        } else {
                            alert('Không tìm thấy địa chỉ: ' + query);
                        }
                    }
                } catch (e) {
                    alert('Lỗi tìm kiếm: ' + e.message);
                } finally {
                    btn.innerHTML = '<i class="fa-solid fa-arrow-right"></i>';
                }
            };

            document.getElementById('btnMapSearch')?.addEventListener('click', searchAddress);
            document.getElementById('mapSearchInput')?.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') searchAddress();
            });
        }

        window.focusMapPin = (lat, lon, ip) => {
            if (!map || isNaN(lat) || isNaN(lon)) return;
            map.flyTo([lat, lon], 16, { duration: 1.2 });
            const key = `${Number(lat).toFixed(4)}_${Number(lon).toFixed(4)}`;
            const marker = markerMap.get(key) || markerMap.get(ip);
            if (marker) {
                setTimeout(() => marker.openPopup(), 600);
            }
        };

        function addMapPin(lat, lon, data, isOrder = false) {
            let finalLat = Number(lat);
            let finalLon = Number(lon);
            if (isOrder && data.address) {
                const addrLower = (data.address || '').toLowerCase();
                if (addrLower.includes('đình thôn') || addrLower.includes('dinh thon')) {
                    finalLat = 21.0175;
                    finalLon = 105.7758;
                }
            }
            if (!map || isNaN(finalLat) || isNaN(finalLon)) return;

            const pinClass = isOrder ? 'radar-pin-order' : 'radar-pin-visitor';
            const iconSymbol = isOrder ? '<i class="fa-solid fa-cake-candles"></i>' : '<i class="fa-solid fa-user"></i>';

            const customIcon = L.divIcon({
                className: 'custom-radar-pin-wrap',
                html: `<div class="${pinClass}">${iconSymbol}</div>`,
                iconSize: isOrder ? [28, 28] : [24, 24],
                iconAnchor: isOrder ? [14, 14] : [12, 12]
            });

            const marker = L.marker([finalLat, finalLon], { icon: customIcon }).addTo(map);

            const timeStr = new Date(data.timestamp || Date.now()).toLocaleTimeString('vi-VN');
            const city = data.city || 'Hà Nội';
            const country = data.country || 'Việt Nam';
            const ip = data.ip || 'Unknown';
            const isp = data.isp || 'Internet';
            const deviceName = data.device_name || data.deviceName || 'PC';
            const os = data.os || '';
            const path = data.path || '/';
            const flag = data.flag || (country.includes('Viet') ? '🇻🇳' : '🌐');
            const fp = data.fingerprint || (data.device && data.device.fingerprint) || 'DEV-ACTIVE';

            const popupHtml = `
                <div class="radar-popup-card">
                    <div class="popup-top">
                        <span class="popup-tag ${isOrder ? 'tag-order' : 'tag-visitor'}">
                            <i class="fa-solid ${isOrder ? 'fa-receipt' : 'fa-satellite-dish'}"></i> ${isOrder ? '★ ĐƠN HÀNG MỚI' : 'KHÁCH TRUY CẬP'}
                        </span>
                        <span class="popup-time">${timeStr}</span>
                    </div>
                    <div class="popup-location">
                        <strong>${flag} ${city}, ${country}</strong>
                    </div>
                    <div class="popup-ip">
                        <code>IP: ${ip}</code>
                    </div>
                    <div class="popup-meta">
                        <div><i class="fa-solid fa-network-wired"></i> Nhà mạng: <strong>${isp}</strong></div>
                        <div><i class="fa-solid fa-laptop"></i> Thiết bị: <strong>${deviceName} ${os ? `(${os})` : ''}</strong></div>
                        <div><i class="fa-solid fa-fingerprint"></i> Mã máy: <strong style="color: #a78bfa;">${fp}</strong></div>
                        <div><i class="fa-regular fa-compass"></i> Trang xem: <code class="path-code">${path}</code></div>
                        ${isOrder && (data.orderId || data.order_id) ? `<div><i class="fa-solid fa-bag-shopping"></i> Mã đơn: <strong style="color: #f59e0b;">#${data.orderId || data.order_id}</strong></div>` : ''}
                        ${isOrder && data.address ? `<div><i class="fa-solid fa-location-dot"></i> Giao tới: <strong style="color: #38bdf8;">${data.address}</strong></div>` : ''}
                    </div>
                    <div class="popup-actions">
                        <a href="https://www.google.com/maps?q=${finalLat},${finalLon}" target="_blank" rel="noopener noreferrer" class="btn-popup-gmaps">
                            <i class="fa-solid fa-map-location-dot"></i> Mở trên Google Maps
                        </a>
                    </div>
                </div>
            `;

            marker.bindPopup(popupHtml, { maxWidth: 280, className: 'dark-radar-popup' });
            markers.push(marker);

            const key = `${Number(finalLat).toFixed(4)}_${Number(finalLon).toFixed(4)}`;
            markerMap.set(key, marker);
            if (ip && ip !== 'Unknown') markerMap.set(ip, marker);

            document.getElementById('mapPinCount').textContent = `${markers.length} Pinned Locations`;
            return marker;
        }

        function renderVisitorCard(v) {
            const timeStr = new Date(v.timestamp || Date.now()).toLocaleTimeString('vi-VN');
            const city = v.city || 'Hà Nội';
            const country = v.country || 'Việt Nam';
            const lat = v.lat || 21.0285;
            const lon = v.lon || 105.8542;
            const gmapUrl = `https://www.google.com/maps?q=${lat},${lon}`;

            let deviceIcon = 'fa-desktop';
            if (v.device_type === 'Mobile') deviceIcon = 'fa-mobile-screen-button';
            else if (v.device_type === 'Tablet') deviceIcon = 'fa-tablet-screen-button';

            const isVN = v.country_code === 'VN' || country.includes('Viet');

            return `
                <div class="visitor-card" onclick="focusMapPin(${lat}, ${lon}, '${v.ip}')" title="Nhấn để định vị ngay trên bản đồ">
                    <div class="vcard-top">
                        <div class="vcard-ip-wrap">
                            <span class="vcard-dot"></span>
                            <span class="vcard-ip">${v.ip || 'Unknown'}</span>
                        </div>
                        <span class="vcard-time">${timeStr}</span>
                    </div>
                    <div class="vcard-loc">
                        <span class="vcard-flag">${isVN ? '🇻🇳' : '🌐'}</span>
                        <span class="vcard-place">${city}, ${country}</span>
                        <span class="vcard-isp">${v.isp || 'Internet'}</span>
                    </div>
                    <div class="vcard-bottom">
                        <span class="vcard-pill"><i class="fa-solid ${deviceIcon}"></i> ${v.device_name || 'PC'}</span>
                        <span class="vcard-pill path"><i class="fa-solid fa-compass"></i> ${v.path || '/'}</span>
                        <a href="${gmapUrl}" target="_blank" rel="noopener noreferrer" class="vcard-gmaps-link" onclick="event.stopPropagation();" title="Xem trên Google Maps">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                </div>
            `;
        }

        function renderOrderCard(ord) {
            const timeStr = new Date(ord.timestamp || Date.now()).toLocaleTimeString('vi-VN');
            let itemsHtml = '';
            let itemsArr = [];
            try {
                itemsArr = typeof ord.items_json === 'string' ? JSON.parse(ord.items_json) : (ord.items || []);
            } catch {}

            if (itemsArr.length > 0) {
                itemsHtml = itemsArr.map(i => `<div class="ord-item-line">• <strong>${i.title}</strong> <span class="ord-qty">x${i.qty || 1}</span>${i.inscription ? ` <em class="ord-inscr">"${i.inscription}"</em>` : ''}</div>`).join('');
            } else {
                itemsHtml = `<div class="ord-item-line">Tổng số lượng: ${ord.items_count || 1} món bánh</div>`;
            }

            const lat = ord.lat;
            const lon = ord.lon;
            const focusFn = (lat && lon) ? `onclick="focusMapPin(${lat}, ${lon}, '${ord.order_id || ord.orderId}')"` : '';

            return `
                <div class="order-card-live" ${focusFn}>
                    <div class="order-card-top">
                        <span class="order-card-id"><i class="fa-solid fa-receipt"></i> #${ord.order_id || ord.orderId}</span>
                        <span class="order-card-time">${timeStr}</span>
                    </div>
                    <div class="order-card-cust">
                        <span><i class="fa-solid fa-user"></i> ${ord.customer_name || ord.customerName}</span>
                        <span class="cust-phone"><i class="fa-solid fa-phone"></i> ${ord.customer_phone || ord.customerPhone}</span>
                    </div>
                    <div class="order-card-addr">
                        <i class="fa-solid fa-location-dot"></i> ${ord.address || 'Hà Nội'}
                    </div>
                    <div class="order-items-mini">${itemsHtml}</div>
                    ${ord.note ? `<div class="order-note"><em>Lời chúc: "${ord.note}"</em></div>` : ''}
                    <div class="order-card-total">
                        <span class="total-label">Tổng thanh toán:</span>
                        <span class="total-val">${(ord.total_amount || ord.totalAmount || 0).toLocaleString('vi-VN')}₫</span>
                    </div>
                </div>
            `;
        }

        async function syncFromLocalServer() {
            try {
                const res = await fetch('/api/history');
                if (!res.ok) return;
                const data = await res.json();

                const activeEl = document.getElementById('kpiActiveVisitors');
                if (activeEl) activeEl.textContent = data.active_visitors || 0;
                const viewsEl = document.getElementById('kpiTotalViews');
                if (viewsEl) viewsEl.textContent = data.total_visitors || 0;

                if (Array.isArray(data.visitors) && data.visitors.length > 0) {
                    const feed = document.getElementById('visitorStreamFeed');
                    feed.innerHTML = data.visitors.map(renderVisitorCard).join('');
                    document.getElementById('visitorStreamCount').textContent = `${data.visitors.length} Khách`;

                    data.visitors.forEach(v => {
                        if (v.lat && v.lon) {
                            addMapPin(v.lat, v.lon, v, false);
                        }
                    });
                }

                if (Array.isArray(data.orders) && data.orders.length > 0) {
                    const ordersContainer = document.getElementById('ordersFeedContainer');
                    ordersContainer.innerHTML = data.orders.map(renderOrderCard).join('');
                    document.getElementById('liveOrdersBadge').textContent = `${data.orders.length} Đơn`;

                    data.orders.forEach(o => {
                        if (o.lat && o.lon) {
                            addMapPin(o.lat, o.lon, {
                                ...o,
                                ip: o.ip || 'Unknown',
                                city: o.city || 'Hà Nội',
                                country: o.country || 'Việt Nam',
                                isp: 'Order Customer',
                                device_name: o.customer_name || 'Khách Hàng',
                                path: '/checkout'
                            }, true);
                        }
                    });
                }
            } catch {}
        }

        function listenLiveEvents() {
            const telemetrySSE = new EventSource('https://ntfy.sh/poeme_telemetry_live_83921/sse');
            telemetrySSE.onmessage = (e) => {
                try {
                    const payload = JSON.parse(e.data);
                    const msg = payload.message ? JSON.parse(payload.message) : payload;
                    if (msg && msg.type === 'pageview') {
                        const geo = msg.geo || {};
                        const dev = msg.device || {};
                        const rowObj = {
                            timestamp: msg.timestamp || Date.now(),
                            ip: geo.ip || 'Unknown',
                            isp: geo.isp || 'Internet',
                            city: geo.city || 'Hà Nội',
                            country: geo.country || 'Việt Nam',
                            country_code: geo.country_code || 'VN',
                            device_type: dev.deviceType || 'Desktop',
                            device_name: dev.deviceName || 'PC',
                            os: dev.os || '',
                            browser: dev.browser || '',
                            path: msg.path || '/',
                            lat: geo.lat || 21.0285,
                            lon: geo.lon || 105.8542
                        };
                        const feed = document.getElementById('visitorStreamFeed');
                        const placeholder = feed.querySelector('.empty-placeholder');
                        if (placeholder) feed.innerHTML = '';
                        feed.insertAdjacentHTML('afterbegin', renderVisitorCard(rowObj));

                        addMapPin(rowObj.lat, rowObj.lon, rowObj, false);

                        const totalViewsEl = document.getElementById('kpiTotalViews');
                        if (totalViewsEl) totalViewsEl.textContent = (parseInt(totalViewsEl.textContent, 10) || 0) + 1;
                    }
                } catch {}
            };

            const ordersSSE = new EventSource('https://ntfy.sh/poeme_orders_live_83921/sse');
            ordersSSE.onmessage = (e) => {
                try {
                    const payload = JSON.parse(e.data);
                    const msg = payload.message ? JSON.parse(payload.message) : payload;
                    if (msg && msg.type === 'order') {
                        const ordersContainer = document.getElementById('ordersFeedContainer');
                        const emptyNotice = document.getElementById('emptyOrdersNotice');
                        if (emptyNotice) emptyNotice.remove();

                        ordersContainer.insertAdjacentHTML('afterbegin', renderOrderCard(msg));

                        const liveBadge = document.getElementById('liveOrdersBadge');
                        if (liveBadge) {
                            const curCount = parseInt(liveBadge.textContent, 10) || 0;
                            liveBadge.textContent = `${curCount + 1} Đơn`;
                        }

                        if (msg.geo && msg.geo.lat && msg.geo.lon) {
                            addMapPin(msg.geo.lat, msg.geo.lon, {
                                ...msg,
                                ip: msg.geo.ip || 'Unknown',
                                city: msg.geo.city || 'Hà Nội',
                                country: msg.geo.country || 'Việt Nam',
                                isp: 'Order Customer',
                                device_name: msg.customerName || 'Khách Hàng',
                                path: '/checkout'
                            }, true);
                        }
                    }
                } catch {}
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            syncFromLocalServer();
            listenLiveEvents();

            window.addEventListener('resize', () => {
                if (map) map.invalidateSize();
            });

            setTimeout(() => {
                if (map) map.invalidateSize();
            }, 300);

            setInterval(syncFromLocalServer, 8000);

            document.getElementById('btnClearData')?.addEventListener('click', async () => {
                if (confirm('Bạn có chắc muốn xóa sạch toàn bộ lịch sử truy cập và đơn hàng trong database local?')) {
                    await fetch('/api/clear');
                    location.reload();
                }
            });
        });
    </script>
</body>
</html>
